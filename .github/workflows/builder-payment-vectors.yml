name: Official Gloas reference-suite coverage
on:
  pull_request:
    paths:
      - 'Glamsterdam/Common/**'
      - 'Glamsterdam/Gloas7732/**'
      - 'tests/reference_vectors/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - '.github/workflows/builder-payment-vectors.yml'
  push:
    branches: [main]
    paths:
      - 'Glamsterdam/Common/**'
      - 'Glamsterdam/Gloas7732/**'
      - 'tests/reference_vectors/**'
      - 'lean-toolchain'
      - 'lakefile.lean'
      - '.github/workflows/builder-payment-vectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ethereum/consensus-specs
          ref: aa16bb4c156184e9548a997d53efaf2a228a6304
          path: .reference
          persist-credentials: false
      - name: Prepare pinned decoder and compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean-toolchain)"
          python3 -m pip install uv
          cd .reference
          uv sync --frozen --extra test --python 3.12
          uv run --no-sync python -m pysetup.generate_specs --all-forks
      - name: Cache compiled Lean modules and generated C
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: gloas-vector-lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'Glamsterdam/**/*.lean') }}
      - name: Cache digest-checked release archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/payment-vectors
          key: gloas-archives-v1.7.0-beta.4-${{ hashFiles('tests/reference_vectors/inventory.py') }}
      - name: Fetch official v1.7.0-beta.4 archives
        run: |
          mkdir -p "$RUNNER_TEMP/payment-vectors"
          for preset in minimal mainnet general comptests; do
            if test -f "$RUNNER_TEMP/payment-vectors/$preset.tar.gz"; then continue; fi
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/ethereum/consensus-specs/releases/download/v1.7.0-beta.4/$preset.tar.gz" \
              --output "$RUNNER_TEMP/payment-vectors/$preset.tar.gz"
          done
      - name: Verify archive digests and classify every published case and replay supported transitions
        run: .reference/.venv/bin/python tests/reference_vectors/check_payments.py "$RUNNER_TEMP/payment-vectors" payment-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-gloas-coverage
          path: payment-results.json
          if-no-files-found: error
