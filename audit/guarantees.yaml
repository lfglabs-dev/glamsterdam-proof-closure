schema_version: 1
audit_name: "Glamsterdam Formal Audit (EIP-8246, EIP-8037/8038/2780/7778, EIP-7732/8282)"
guarantees:
  - id: "T-COMMON-CHECKPOINT-ROLLBACK"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "t_common_checkpoint_rollback"
    status: "CHECKED"
    statement: "Rolling back a transaction checkpoint after arbitrary in-frame state mutations restores the exact pre-checkpoint State."
  - id: "T-COMMON-RESTORE-TX-STATE-EXACT"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "restore_tx_state_writes_exact"
    status: "CHECKED"
    statement: "restore_tx_state restores all 5 mutable write maps (accountWrites, storageWrites, codeWrites, storageClears, transientStorage) to snapshot while preserving accumulated BAL reads."
  - id: "T-COMMON-STATE-GAS-REFUND-INVERSE"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "credit_after_charge_state_gas_exact"
    status: "CHECKED"
    statement: "LIFO credit_state_gas_refund after charge_state_gas_from_meter is an exact left-inverse on GasMeter whenever the spill invariant holds."
  - id: "T-COMMON-REPAY-SPILL-INVARIANT"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "repay_state_gas_spill_invariant"
    status: "CHECKED"
    statement: "repay_state_gas_spill preserves gasLeft + stateGasLeft and guarantees stateGasLeft = 0 or stateGasSpilled = 0 after child frame merge."
  - id: "T-COMMON-RESTORE-TO-ENTRY-SOUND"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "restore_state_gas_to_entry_sound"
    status: "CHECKED"
    statement: "restore_state_gas_to_entry undoes commit_state_gas and refills all spilled and reservoir state gas on pre-dispatch failure."
  - id: "T-COMMON-SPILL-INVARIANT-PRESERVED"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "spill_invariant_preserved_by_meter_ops"
    status: "CHECKED"
    statement: "Every GasMeter transition (charge_gas_from_meter, charge_state_gas_from_meter, credit_state_gas_refund, commit_state_gas, restore_state_gas, repay_state_gas_spill) preserves the spill invariant (stateGasLeft = 0 or stateGasSpilled = 0)."
  - id: "T-COMMON-CHILD-REVERT-DISCARDS-DELETES"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "incorporate_child_frame_revert_discards_deletes"
    status: "CHECKED"
    statement: "When a child frame reverts or halts, incorporate_child_frame discards child.accountsToDelete and restores all 5 mutable write maps of parentSnapshot.txState."
  - id: "T-COMMON-ACCOUNT-EXISTS-IFF-ALIVE-WF"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "account_exists_iff_alive_of_no_empty_leaves"
    status: "CHECKED"
    statement: "Under NoEmptyAccountLeaves, account_exists and is_account_alive coincide for every address."
  - id: "T-COMMON-NO-EMPTY-LEAVES-PRESERVED"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "no_empty_account_leaves_preserved"
    status: "CHECKED"
    statement: "All state_tracker.py account mutators (modify_state, set_account_balance_tx, move_ether_tx, create_ether, increment_nonce, set_code) preserve NoEmptyAccountLeaves."
  - id: "T-COMMON-READ-ACCOUNT-RECORDS-READ"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "read_account_tx_records_read"
    status: "CHECKED"
    statement: "Stateful read_account_tx returns get_account and records addr in accountReads whenever addr is not in accountWrites."
  - id: "T-COMMON-READ-STORAGE-RECORDS-READ"
    domain: "Common"
    file: "Glamsterdam/Common/ElCore.lean"
    theorem: "read_storage_tx_records_read"
    status: "CHECKED"
    statement: "Stateful read_storage_tx returns get_storage and records (addr, key) in storageReads whenever (addr, key) is not in storageWrites and addr is not in storageClears."
  - id: "T-8246-BALANCE-PRESERVED"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_balance_preserved"
    kill_line: "m_8246_1_refuter"
    status: "CHECKED"
    statement: "clear_account_preserving_balance preserves both target account balance and recipient balance across end-of-tx cleanup."
  - id: "T-8246-SAME-TX-CREATE-DESTROY"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_same_tx_create_destroy"
    status: "CHECKED"
    statement: "For accounts in created_accounts intersect accounts_to_delete, clear_account_preserving_balance zeroes nonce, clears code, and destroys storage while preserving balance."
  - id: "T-8246-TX-STATE-CLEAR-EXACT"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_tx_state_clear_exact"
    status: "CHECKED"
    statement: "On TransactionState, clear_account_preserving_balance_tx preserves balance, zeroes nonce/code/storage, and deletes the account leaf iff balance == 0."
  - id: "T-8246-SELFDESTRUCT-CONSERVATION"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_selfdestruct_conservation"
    status: "CHECKED"
    statement: "exec_selfdestruct conserves ETH for both distinct beneficiaries and self-beneficiaries (no self-burn)."
  - id: "T-8246-NO-STATE-GAS-REFUND"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_no_state_gas_refund"
    status: "CHECKED"
    statement: "Same-transaction CREATE + SELFDESTRUCT grants zero state-gas refund under EIP-8246 + EIP-8037."
  - id: "T-8246-ETH-CONSERVATION"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_eth_conservation"
    meta_gate: "ethConservationMetaGate"
    status: "CHECKED"
    statement: "1-to-1 ETH conservation across clear_account_preserving_balance and EL balance transfers."
  - id: "T-8246-FEE-SETTLEMENT-CONSERVATION"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_tx_fee_settlement_conservation"
    status: "CHECKED"
    statement: "update_sender_state and disburse_gas_fees conserve total ETH across sender, coinbase, and burned base/blob fees."
  - id: "T-8246-BAL-PATCHED-SOUND"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_bal_patched_sound"
    kill_line: "f_8246_bal_storage_clears_ignored_refuter"
    status: "CHECKED"
    statement: "Patched update_builder_from_tx records storage_clears in Block Access Lists (refuting F-8246-BAL-STORAGE-CLEARS-IGNORED in commit 16898000)."
  - id: "T-8246-STORAGE-CLEARS-RECORDED-IN-BAL"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_storage_clears_recorded_in_bal"
    status: "CHECKED"
    statement: "End-to-end theorem connecting destroy_storage_tx and clear_account_preserving_balance_tx via incorporate_tx_into_block to update_builder_from_tx."
  - id: "T-8246-BAL-TX-BLOCK-STATE-DESYNC"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "t_8246_bal_tx_block_state_desync"
    status: "CHECKED"
    statement: "Across two transactions Tx1 (CREATE2 + SSTORE) and Tx2 (destroy_storage_tx) in the same block, incorporate_tx_into_block wipes BlockState storage to 0 while tx2.storageWrites is empty and tx2.storageClears is ignored by update_builder_from_tx."
  - id: "T-8246-UNCHECKED-SYS-TX-DELETES-REFUTER"
    domain: "EIP-8246"
    file: "Glamsterdam/Eip8246/Spec.lean"
    theorem: "f_8246_unchecked_sys_tx_drops_deletes_refuter"
    kill_line: "f_8246_unchecked_sys_tx_drops_deletes_refuter"
    status: "CHECKED"
    statement: "Refutes F-8246-UNCHECKED-SYS-TX-DROPS-ACCOUNTS-TO-DELETE where process_unchecked_system_transaction drops tx_output.accounts_to_delete."
  - id: "T-8037-METER-RESERVOIR-ROUNDTRIP-REVERT"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8037_meter_reservoir_roundtrip_on_revert"
    status: "CHECKED"
    statement: "On the 6-field GasMeter, draining stateGasLeft into a child frame, charging state gas with spill into gasLeft, and reverting via restore_state_gas + incorporate_child_meter restores parent.stateGasLeft and parent.gasLeft."
  - id: "T-8037-SYS-TX-RESERVOIR-SOUND"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8037_sys_tx_reservoir_sound"
    status: "CHECKED"
    statement: "process_unchecked_system_transaction initializes GasMeter(gas_left=30,000,000, state_gas_left=1,566,720, state_gas_baseline=1,566,720) from SYSTEM_TRANSACTION_GAS and StateGasCosts.STORAGE_SET * SYSTEM_MAX_SSTORES_PER_CALL, satisfying meterSpillInvariant."
  - id: "T-2780-7928-SET-DELEGATION-OOG-REFUTER"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "f_2780_7928_set_delegation_oog_omits_recipient_refuter"
    kill_line: "f_2780_7928_set_delegation_oog_omits_recipient_refuter"
    status: "CHECKED"
    statement: "Refutes F-2780-7928-SET-DELEGATION-OOG-OMITS-RECIPIENT-READ where OOG during set_delegation in create_evm aborts process_top_level before get_account(tx_state, recipient) records recipient in account_reads."
  - id: "T-8037-CHARGE-GAS-SOUND"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8037_charge_gas_sound"
    status: "CHECKED"
    statement: "Two-leg charge_gas preserves post.gasLeft + post.stateGasReservoir + regularGas + stateGas = pre.gasLeft + pre.stateGasReservoir and never underflows."
  - id: "T-8037-RESERVOIR-ROUNDTRIP"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8037_reservoir_roundtrip_success"
    status: "CHECKED"
    statement: "100% of stateGasReservoir is forwarded to child frames and returned intact on both child success and child revert/error."
  - id: "T-8037-CREATE-ORDER"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "m_8037_1_refuter"
    kill_line: "m_8037_1_refuter"
    status: "CHECKED"
    statement: "CREATE/CREATE2 deducts stateCreateGas before computing the 63/64 child execution gas cap, refuting pre-spill 63/64 mutants."
  - id: "T-8037-ALLOCATE-EVM-GAS-SOUND"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8037_allocate_evm_gas_sound"
    status: "CHECKED"
    statement: "allocate_evm_gas partitions txGas into intrinsic.execution + executionGas + stateGasReservoir with intrinsic.execution + executionGas <= TX_MAX_GAS_LIMIT."
  - id: "T-7778-8037-DUAL-CAP"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_7778_8037_dual_cap"
    status: "CHECKED"
    statement: "Block gas bottleneck max(executionGasUsed, stateGasUsed) upper-bounds both dimensions while block executionGasUsed is invariant to refundCounter."
  - id: "T-8038-2780-WARM-COLD"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8038_2780_warm_cold_bounds"
    status: "CHECKED"
    statement: "Warm/cold access gas ordering and state-gas byte pricing bounds hold."
  - id: "T-8038-7778-SSTORE-RESET-REFUTER"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "f_8038_7778_sstore_reset_refuter"
    kill_line: "f_8038_7778_sstore_reset_refuter"
    status: "CHECKED"
    statement: "Refutes F-8038-7778-SSTORE-RESET-REFUND-CAP-AND-BLOCK-GAS where 0->X->0 SSTORE reset routes STORAGE_WRITE (10,000) through refund_counter."
  - id: "T-8037-7702-DELEGATION-INVARIANT-EQUIV"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "t_8037_7702_delegation_exists_eq_alive_under_invariant"
    status: "CHECKED"
    statement: "Under NoEmptyAccountLeaves (preserved by all state_tracker.py mutators), set_delegation's account_exists check and is_account_alive charge identical state gas."
  - id: "T-8037-7702-DELEGATION-EXISTS-VS-ALIVE"
    domain: "Gas (8037/8038/2780/7778)"
    file: "Glamsterdam/Gas/Spec.lean"
    theorem: "f_8037_7702_delegation_exists_vs_alive_refuter"
    kill_line: "f_8037_7702_delegation_exists_vs_alive_refuter"
    status: "CHECKED"
    statement: "Refutes F-8037-7702-DELEGATION-ACCOUNT-EXISTS-VS-ALIVE on unpruned pre-states containing an explicit EMPTY_ACCOUNT leaf where account_exists != is_account_alive."
  - id: "T-7732-SINGLE-SETTLEMENT"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_single_settlement"
    status: "CHECKED"
    statement: "Every committed builder bid is settled at most once across apply_parent_execution_payload (settle_builder_payment) and process_builder_pending_payments across all ChildConfirmationTiming cases."
  - id: "T-7732-NO-ETH-MINTING"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_no_eth_minting"
    status: "CHECKED"
    statement: "Potuz Property 1 (Supply Neutrality): Builder bid settlement across apply_parent_execution_payload, process_builder_pending_payments, and apply_withdrawals is strictly supply-neutral (postBuilderBalance + settled = builderBalance) with zero saturation inflation."
  - id: "T-7732-PAYMENT-GUARANTEE"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_payment_guarantee"
    status: "CHECKED"
    statement: "Potuz Property 2 (Proposer Payment Guarantee): If a committed bid has bidValue > 0 and the block is either confirmed by the child block or attested to weight >= quorum, the proposer's feeRecipient receives an exact BuilderPendingWithdrawal of bidValue."
  - id: "T-7732-QUORUM-NO-DOUBLE-COUNT"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_quorum_no_double_count"
    status: "CHECKED"
    statement: "In process_attestation, had_no_participation and will_set_new_flag guarantee that two attestations from the same validator in an epoch add effectiveBalance to payment.weight at most once."
  - id: "T-7732-QUORUM-WEIGHT-UNCONDITIONAL"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_quorum_weight_unconditional"
    status: "CHECKED"
    statement: "Unconditionally across any arbitrary sequence of attestations in an epoch, each validator contributes at most effectiveBalance to payment.weight."
  - id: "T-7732-SAME-SLOT-UNBUNDLING"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_same_slot_unbundling"
    status: "CHECKED"
    statement: "Potuz Property 3 (Same-Slot Unbundling Resistance): Under bid block_hash commitment in process_execution_payload_bid and parent_block_hash verification in process_parent_execution_payload, no canonical full payload at slot N other than the builder's committed payload can include a private transaction."
  - id: "T-7732-SLASH-VALIDATOR-CLEARS-PAYMENTS"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_slash_validator_clears_matching_payments"
    status: "CHECKED"
    statement: "slash_validator iterates over state.builder_pending_payments and clears every entry whose proposer_index equals slashed_index to BuilderPendingPayment.empty()."
  - id: "T-7732-SLASHED-NO-RESURRECTION"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_slashed_no_resurrection"
    kill_line: "f_7732_slashed_payment_resurrection_refuter"
    status: "CHECKED"
    statement: "Patched slash_validator + apply_parent_execution_payload never resurrects a slashed proposer's revoked builder payment after 2+ missed epochs (refuting F-7732-SLASHED-PAYMENT-RESURRECTION in v1.7.0-beta.4)."
  - id: "T-7732-BUILDER-SOLVENCY"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_builder_solvency"
    status: "CHECKED"
    statement: "can_builder_cover_bid = true guarantees builderBalance >= MIN_DEPOSIT_AMOUNT + pendingToWithdraw + bidAmount."
  - id: "T-7732-EXIT-SAFETY"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_exit_safety"
    status: "CHECKED"
    statement: "process_builder_exit_request only initiates builder exit when pendingToWithdraw = 0."
  - id: "T-7732-DEFERRED-EXEC-EQUIV"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_deferred_exec_equiv_empty"
    status: "CHECKED"
    statement: "Deferred payload execution only mutates builder payment and withdrawal state when a child block confirms bid.parent_block_hash == parent_bid.block_hash."
  - id: "T-7732-FRAME"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_7732_frame"
    status: "CHECKED"
    statement: "EIP-7732 parent payload and builder payment transitions preserve untouched CL state invariants (validator deposits/exits, BLS-to-execution changes, sync committee)."
  - id: "T-8282-7732-QUEUE-SAFETY"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "t_8282_7732_queue_safety"
    status: "CHECKED"
    statement: "In process_parent_execution_payload (beacon-chain.md:1841-1854), valid_parent_execution_requests holds iff either bid.parent_block_hash != parent_bid.block_hash and parent_execution_requests is empty, or bid.parent_block_hash == parent_bid.block_hash and hash_tree_root(requests) == parent_bid.execution_requests_root."
  - id: "T-8282-TOPUP-CREDENTIAL-REFUTER"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "f_8282_topup_credential_prefix_drop_refuter"
    kill_line: "f_8282_topup_credential_prefix_drop_refuter"
    status: "CHECKED"
    statement: "Refutes F-8282-TOPUP-CREDENTIAL-PREFIX-DROP in process_builder_deposit_request (v1.7.0-beta.4) where top-ups with non-0xB0 credentials are ignored."
  - id: "T-7732-FORK-AVAILABILITY-REFUTER"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "f_7732_fork_slot_availability_refuter"
    kill_line: "f_7732_fork_slot_availability_refuter"
    status: "CHECKED"
    statement: "Refutes F-7732-FORK-SLOT-AVAILABILITY-BIT-HIGH in upgrade_to_gloas (v1.7.0-beta.4)."
  - id: "T-7732-RING-BUFFER-CLOBBER-REFUTER"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "f_7732_availability_ring_buffer_clobber_refuter"
    kill_line: "f_7732_availability_ring_buffer_clobber_refuter"
    status: "CHECKED"
    statement: "Refutes F-7732-AVAILABILITY-RING-BUFFER-CLOBBER when childSlot - parentSlot == k * SLOTS_PER_HISTORICAL_ROOT."
  - id: "T-7732-FORK-ONBOARD-CROSS-CREDENTIAL-REFUTER"
    domain: "Gloas EIP-7732 + EIP-8282"
    file: "Glamsterdam/Gloas7732/Spec.lean"
    theorem: "f_7732_fork_onboard_cross_credential_refuter"
    kill_line: "f_7732_fork_onboard_cross_credential_refuter"
    status: "CHECKED"
    statement: "Refutes F-7732-FORK-ONBOARD-CROSS-CREDENTIAL where onboard_builders_from_pending_deposits (fork.md:115-117) consumes non-0xB0 deposits for pubkeys already in builder_pubkeys."
  - id: "T-CALLTREE-SSTORE-SENTRY-EXCLUDES-RESERVOIR"
    domain: "Gas CallTree (FV-CORE)"
    file: "Glamsterdam/Gas/CallTree.lean"
    theorem: "t_calltree_sstore_sentry_excludes_reservoir"
    status: "CHECKED"
    statement: "Whenever fm.meter.gasLeft <= 2300 (GAS_SSTORE_SENTRY), exec_sstore_frame halts with OutOfGasError under every ForkSchedule and for every reservoir size stateGasLeft."
  - id: "T-CALLTREE-A1-FRAME-BOUND"
    domain: "Gas CallTree (FV-CORE)"
    file: "Glamsterdam/Gas/CallTree.lean"
    theorem: "t_calltree_a1_frame_bound"
    status: "CHECKED"
    statement: "Within a single frame under amsterdamD0, every execution charge, state charge, and LIFO state-gas refill preserves the upper bound post.gasLeft + post.stateGasSpilled <= m.gasLeft + m.stateGasSpilled."
  - id: "T-CALLTREE-E1-FIXED-GRANT-STARVATION"
    domain: "Gas CallTree (FV-CORE)"
    file: "Glamsterdam/Gas/CallTree.lean"
    theorem: "t_calltree_e1_fixed_grant_starvation"
    status: "CHECKED"
    statement: "When stateGasLeft = 0 (tx.gas <= 2^24), a fixed-grant child frame with gasLeft = 50000 writing one warm fresh slot (0 -> 1) succeeds on osaka and deterministically OOGs across every Amsterdam refill variant (D0, D1, D3, D4, D13, D13R, D13S)."
  - id: "T-CALLTREE-E3-M2-DIRTY-CLEAR-AND-D13R-BREAK"
    domain: "Gas CallTree (FV-CORE)"
    file: "Glamsterdam/Gas/CallTree.lean"
    theorem: "t_calltree_e3_m2_dirty_clear_band_and_d13r_break"
    status: "CHECKED"
    statement: "On the T2 (M2 set-call-clear) multi-frame pattern, amsterdamD0 exhibits a silent-failure band (outerSuccess = true, childSuccess = false), amsterdamD1 and amsterdamD13 eliminate it, and amsterdamD13R re-opens it whenever any post-clear subcall (flushCall = true, T2f) occurs."
  - id: "T-CALLTREE-D13R-NEW-T1-BAND"
    domain: "Gas CallTree (FV-CORE)"
    file: "Glamsterdam/Gas/CallTree.lean"
    theorem: "t_calltree_d13r_introduces_new_t1_band"
    status: "CHECKED"
    statement: "On the T1 pre-call set-and-clear pattern (0 -> 1 -> 0 before CALL(GAS)), amsterdamD0 succeeds in both child and parent, whereas amsterdamD13R introduces a new silent-failure band by starving the child and repaying 97,920 into gasLeft upon failed child exit."
  - id: "T-CALLTREE-E3-M3-REVERT-RESTORE-BAND"
    domain: "Gas CallTree (FV-CORE)"
