schema_version: 1
assumptions:
  - id: "A-NO-PRE-EXISTING-STORAGE-ON-CREATE"
    domain: "EIP-8246"
    description: "Target address of CREATE/CREATE2 has empty storage prior to account creation (nonce == 0, code == b'', storage == {}). Pre-Spurious Dragon storage-only collision accounts are addressed separately by EIP-8253 (Hegota)."
  - id: "A-CRYPTO-PRIMITIVES"
    domain: "All"
    description: "Keccak-256, SHA-256, secp256k1 ECDSA, and BLS12-381 signature/hash primitives behave as collision-resistant mathematical functions."
  - id: "A-SAME-SLOT-UNBUNDLING-BOUNDARY"
    domain: "Gloas EIP-7732"
    description: "For same-slot unbundling resistance (t_7732_same_slot_unbundling): (1) a private transaction txPriv is known only to the builder of slot N prior to payload envelope reveal, (2) there is no competing consensus block at slot N prior to the attestation deadline other than the block committing to bid.block_hash via process_execution_payload_bid, and (3) ExecutionPayload.block_hash is collision-resistant."
exclusions:
  - id: "X-GLOAS-FORK-CHOICE"
    domain: "Gloas EIP-7732"
    description: "specs/gloas/fork-choice.md full LMD-GHOST payload tree and PTC timeliness tie-breaking are out of scope of the core BeaconState transition audit (only the deterministic parent-payload selector should_build_on_full vs validator.md:216-356 in consensus-specs#5763 is modeled in Glamsterdam/Gloas7732/Spec.lean)."
  - id: "X-GLOAS-P2P-GOSSIP"
    domain: "Gloas EIP-7732"
    description: "specs/gloas/p2p-interface.md and libp2p GossipSub topics for execution payload bids and envelopes are out of scope."
  - id: "X-EIP-8253-COLLISION-WIPE"
    domain: "EIP-8246"
    description: "EIP-8253 storage wipe on deployment collision (scheduled for Hegota) is excluded from EIP-8246 scope per Paweł Bylica."
